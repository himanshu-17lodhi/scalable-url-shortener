name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.12.10


      - name: Check Linting
        run: ruff check app tests

      - name: Check Formatting
        run: ruff format --check app tests

  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d url_shortener_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/url_shortener_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: pytest

  migrations:
    name: Alembic Migration Check
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener_mig_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d url_shortener_mig_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic Upgrade Head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/url_shortener_mig_test
        run: alembic upgrade head

      - name: Verify Alembic Migration Head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/url_shortener_mig_test
        run: |
          CURRENT_HEAD=$(alembic current)
          echo "$CURRENT_HEAD"
          echo "$CURRENT_HEAD" | grep -q "001_initial_schema (head)"

  docker-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: migrations
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t scalable-url-shortener:latest .

      - name: Start Docker Compose Stack
        run: docker compose up -d --build

      - name: Wait for application liveness
        run: |
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health/liveness | grep -q '"status":"ok"'; then
              echo "FastAPI container is live!"
              exit 0
            fi
            sleep 1
          done
          echo "FastAPI container failed to start"
          docker compose logs web
          exit 1

      - name: Verify Container Startup Migrations & API Behavior
        run: |
          curl -f http://127.0.0.1:8000/health
          docker compose exec -T web alembic current | grep -q "001_initial_schema (head)"

          CREATE_RESP=$(curl -s -X POST http://127.0.0.1:8000/api/v1/urls \
            -H "Content-Type: application/json" \
            -d '{"url": "https://example.com/ci-smoke-test"}')
          echo "Create response: $CREATE_RESP"
          SHORT_CODE=$(echo $CREATE_RESP | grep -o '"short_code":"[^"]*' | cut -d'"' -f4)
          echo "Short code: $SHORT_CODE"

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/$SHORT_CODE)
          if [ "$HTTP_CODE" -ne 307 ]; then
            echo "Expected 307 redirect, got $HTTP_CODE"
            exit 1
          fi

          curl -f http://127.0.0.1:8000/api/v1/urls/$SHORT_CODE/analytics

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v

  publish:
    name: Build & Publish Image to GHCR
    runs-on: ubuntu-latest
    needs: docker-smoke-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}